<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILE Text to Audio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        .card {
            width: min(760px, 92vw);
            background: #1f2937;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }
        h1 {
            margin: 0 0 20px;
            font-size: 2rem;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        select, textarea, button {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #374151;
            padding: 12px 14px;
            font-size: 1rem;
        }
        select, textarea {
            background: #0f172a;
            color: #f9fafb;
        }
        textarea {
            min-height: 180px;
            resize: vertical;
            margin-top: 10px;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        button {
            background: #ef4444;
            color: white;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        button.secondary {
            background: #374151;
        }
        .link-btn {
            margin-top: 18px;
            display: inline-block;
            text-decoration: none;
            text-align: center;
            background: #374151;
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
        }
        .audio-box {
            margin-top: 20px;
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 8px;
        }
        .status {
            margin-top: 12px;
            color: #cbd5e1;
            min-height: 22px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Text to Audio</h1>

        <label for="tts-language">Language</label>
        <select id="tts-language">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="ja">Japanese</option>
        </select>

        <label for="tts-text" style="margin-top: 18px;">Text</label>
        <textarea id="tts-text" placeholder="Type or paste the text here..."></textarea>

        <div class="actions">
            <button id="generate-audio">Generate Audio</button>
            <button id="copy-text" class="secondary">Copy Text</button>
        </div>

        <a class="link-btn" href="/how-it-works.html">How it works</a>

        <div class="status" id="status"></div>

        <div class="audio-box" id="audio-box">
            <audio id="tts-audio" controls></audio>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
