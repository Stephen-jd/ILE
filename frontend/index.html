<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfa" />
    <title>ILE | Let's simplify everything</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="ILE home">ILE</a>
        <div class="auth-actions">
            <a class="login-link" id="oauth-login" href="/api/auth/login">Login</a>
            <span class="auth-user" id="auth-user" hidden></span>
            <button class="login-link auth-logout" id="auth-logout" type="button" hidden>Logout</button>
        </div>
        <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <p class="eyebrow">WE DON'T JUST BUILD. WE SOLVE.</p>
            <h1 id="hero-title">Let's simplify everything.</h1>
            <form class="search" id="tool-search-form" role="search">
                <span class="search-mark" aria-hidden="true">✳</span>
                <input id="tool-search" type="search" autocomplete="off" placeholder="What do you want to build today?" aria-label="Find a tool" />
                <button type="submit" aria-label="Search tools">→</button>
            </form>
        </section>

        <section class="tools-grid" aria-label="ILE tools">
            <button class="tool-card" type="button" data-tool="resume">
                <span class="tool-icon coral" aria-hidden="true">▣</span>
                <span class="tool-title">Resume Analyzer (AI)</span>
                <span class="tool-desc">Upload CV &amp; job description</span>
            </button>
            <button class="tool-card" type="button" data-tool="image">
                <span class="tool-icon red" aria-hidden="true">▧</span>
                <span class="tool-title">Text to Image</span>
                <span class="tool-desc">Generate images from prompts</span>
            </button>
            <button class="tool-card" type="button" data-tool="code">
                <span class="tool-icon green" aria-hidden="true">&lt;/&gt;</span>
                <span class="tool-title">Code Explainer</span>
                <span class="tool-desc">AI breaks down complex code</span>
            </button>
            <button class="tool-card" type="button" data-tool="markdown">
                <span class="tool-icon violet" aria-hidden="true">MD</span>
                <span class="tool-title">MD to HTML</span>
                <span class="tool-desc">Convert markdown instantly</span>
            </button>
            <button class="tool-card" type="button" data-tool="beautify">
                <span class="tool-icon pink" aria-hidden="true">✎</span>
                <span class="tool-title">Beautifier</span>
                <span class="tool-desc">Format your drafts</span>
            </button>
            <button class="tool-card" type="button" data-tool="pdf">
                <span class="tool-icon coral" aria-hidden="true">▧</span>
                <span class="tool-title">PDF to Text</span>
                <span class="tool-desc">Extract text from PDFs</span>
            </button>
            <button class="tool-card" type="button" data-tool="audio">
                <span class="tool-icon yellow" aria-hidden="true">◖))</span>
                <span class="tool-title">Text to Audio</span>
                <span class="tool-desc">Speak audio from text</span>
            </button>
            <button class="tool-card" type="button" data-tool="resize">
                <span class="tool-icon teal" aria-hidden="true">⛶</span>
                <span class="tool-title">Image Resize</span>
                <span class="tool-desc">Change image dimensions</span>
            </button>
            <button class="tool-card" type="button" data-tool="hyperlink">
                <span class="tool-icon blue" aria-hidden="true">↗</span>
                <span class="tool-title">Hyperlink Generator</span>
                <span class="tool-desc">Create an HTML link</span>
            </button>
            <button class="tool-card" type="button" data-tool="shortener">
                <span class="tool-icon orange" aria-hidden="true">↔</span>
                <span class="tool-title">URL Shortener</span>
                <span class="tool-desc">Create a short, reusable URL</span>
            </button>
        </section>

        <p class="empty-state" id="empty-state" hidden>No tools match that search.</p>
        <footer class="site-footer"><a href="/how-it-works.html">How it works &amp; requirements</a></footer>
    </main>

    <dialog class="tool-dialog" id="tool-dialog" aria-labelledby="dialog-title">
        <div class="dialog-head">
            <h2 id="dialog-title"></h2>
            <button class="icon-button" id="dialog-close" type="button" aria-label="Close tool">×</button>
        </div>
        <div id="dialog-content"></div>
    </dialog>

    <script src="/js/app.js" defer></script>
</body>
</html>
